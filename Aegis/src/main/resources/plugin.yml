name: Aegis
main: com.aegis.AegisPlugin
version: 1.0.0
api-version: "1.20"
authors: ["TuNombre"]
description: Plugin de economía, tiendas, trabajos y misiones
commands:
  eco:
    description: Comandos de economía
    usage: /eco [balance|deposit|withdraw|pay]
  jobs:
    description: Gestión de trabajos
    usage: /jobs [list|join]
  missions:
    description: Gestión de misiones
    usage: /missions [list|claim]
  shop:
    description: Abrir tienda de Aegis
    usage: /shop
